<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Question pour toi...</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        h1 { color: #d63384; text-align: center; margin-bottom: 30px; }
        .btn-container {
            display: flex;
            gap: 20px;
            position: relative;
            width: 300px;
            justify-content: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            width: 100px;
            transition: 0.1s;
        }
        .btn-yes { background-color: #ff4d6d; color: white; }
        .btn-no { background-color: #888; color: white; }
    </style>
</head>
<body>

    <h1 id="question">Veux-tu sortir avec moi ?? ❤️</h1>

    <div class="btn-container">
        <button id="btn1" class="btn-yes" onmouseenter="swap()" ontouchstart="swap()" onclick="check(this)">Oui</button>
        <button id="btn2" class="btn-no" onmouseenter="swap()" ontouchstart="swap()" onclick="check(this)">Non</button>
    </div>

    <script>
        let count = 0;
        const maxRepetitions = 10;

        function swap() {
            if (count < maxRepetitions) {
                const btn1 = document.getElementById('btn1');
                const btn2 = document.getElementById('btn2');

                // On échange les textes
                const tempText = btn1.innerText;
                btn1.innerText = btn2.innerText;
                btn2.innerText = tempText;

                // On échange les couleurs (classes)
                btn1.classList.toggle('btn-yes');
                btn1.classList.toggle('btn-no');
                btn2.classList.toggle('btn-yes');
                btn2.classList.toggle('btn-no');

                count++;
            }
        }

        function check(btn) {
            if (btn.innerText === "Oui") {
                document.body.innerHTML = "<h1>Je savais que tu finirais par dire OUI ! 😍❤️</h1>";
            }
        }
    </script>
</body>
</html>
