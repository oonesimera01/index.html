<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une petite question...</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6; /* Rose pâle comme dans la vidéo */
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Empêche de scroller pour tricher */
        }
        h1 { color: #d63384; text-align: center; font-size: 24px; padding: 0 20px; }
        .container { position: relative; width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            transition: 0.1s;
            position: absolute;
            touch-action: none; /* Important pour Android */
        }
        #yesBtn { background-color: #ff4d6d; color: white; transform: translateX(-70px); }
        #noBtn { background-color: #888; color: white; transform: translateX(70px); z-index: 10; }
        img { border-radius: 15px; margin-bottom: 20px; max-width: 80%; }
    </style>
</head>
<body>

    <h1>Will you be my girlfriend, Ronny? ❤️</h1>
    
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZAmS8dy8dy8dy/l41lTf6fS8sH2Z8pW/giphy.gif" width="200">

    <div class="container">
        <button id="yesBtn" onclick="celebrate()">Yes</button>
        <button id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()">No</button>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            // Calcule une position aléatoire sur l'écran
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            noBtn.style.transform = 'none'; // Enlève le centrage du début
        }

        function celebrate() {
            // Le message de réussite quand elle clique sur Oui
            alert("Je savais que tu dirais oui ! 😍");
            document.body.innerHTML = "<h1>C'est promis ! 🌹❤️</h1><img src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZAmS8dy8dy8dy/3oz8xAFtqoNEAf6SxW/giphy.gif' width='250'>";
        }
    </script>
</body>
</html>
