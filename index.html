<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Une surprise pour toi</title>
    <style>
        :root { --pink: #ff4d6d; --dark-pink: #d63384; --bg: #fff0f3; }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 80%;
            max-width: 400px;
            z-index: 2;
        }
        h1 { color: var(--dark-pink); font-size: 1.5rem; margin-bottom: 20px; }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            height: 60px;
        }
        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        #yesBtn { background-color: var(--pink); color: white; }
        #noBtn { 
            background-color: #dee2e6; 
            color: #495057; 
            position: fixed; /* Sort du flux pour bouger partout */
            z-index: 1000;
        }
        img { width: 150px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZAmS8dy8dy8dy/T86clvgryfS5G/giphy.gif" alt="Cute bear">
        <h1>VODY AHO? ✨</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="success()">OUI !</button>
            <button id="noBtn" onmouseover="escape()" ontouchstart="escape()">NON</button>
        </div>
    </div>

    <script>
        function escape() {
            const btn = document.getElementById('noBtn');
            const margin = 50;
            
            // Calcul pour que le bouton ne sorte jamais de l'écran
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - margin * 2) + margin;
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - margin * 2) + margin;
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function success() {
            // Remplace tout le contenu par le message final
            document.body.innerHTML = `
                <div style="text-align:center;">
                    <h1 style="font-size:3rem;"🤣EFA FANTATRO 🤣</h1>
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZAmS8dy8dy8dy/KztT2c4u8mYYUiMKdJ/giphy.gif" width="300">
                </div>
            `;
        }
    </script>
</body>
</html>
