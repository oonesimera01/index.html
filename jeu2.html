<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Question pour toi...</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Empêche le scroll si le bouton bouge */
            touch-action: manipulation;
        }
        h1 { color: #d63384; text-align: center; padding: 0 20px; z-index: 1; }
        .container { position: relative; width: 100%; height: 100px; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            position: absolute;
            transition: 0.1s ease;
            touch-action: none; /* Bloque le clic Android standard */
        }
        #yesBtn { background-color: #ff4d6d; color: white; left: 50%; transform: translateX(-110%); }
        #noBtn { background-color: #888; color: white; left: 50%; transform: translateX(10%); z-index: 10; }
        img { border-radius: 15px; margin-bottom: 20px; max-width: 180px; }
    </style>
</head>
<body>

    <h1>Angah ndry MAMPIRAFY anah, RY FAMENO ? ❤️</h1>
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZAmS8dy8dy8dy/l41lTf6fS8sH2Z8pW/giphy.gif">

    <div class="container">
        <button id="yesBtn" onclick="celebrate()">Oui</button>
        <button id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()">Non</button>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const padding = 20; // Distance minimum des bords de l'écran
            
            // Calcule la zone disponible sans sortir de la vue (viewport)
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            // Génère une position aléatoire entre le padding et le max
            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.transform = 'none'; // Désactive le centrage initial
        }

        function celebrate() {
            alert("Efa fantatro hoe NON ny valiny ! 🤣😍");
            document.body.innerHTML = "<h1 style='color:#d63384'>JE T'AIME FAMENO ! ❤️🌹</h1><img src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3bmZ3bmZ3JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZAmS8dy8dy8dy/3oz8xAFtqoNEAf6SxW/giphy.gif' width='250'>";
        }
    </script>
</body>
</html>
